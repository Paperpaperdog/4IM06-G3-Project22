# Native-spectrum 6-class spectral CNN, observed size 128.
# Class set matches the n6 Mask sweep (downsample x8/x16, upsample x4/x8).
# Note: downsample_x16 crops 16*128 = 2048 px from each source TIFF.
experiment_name: n6_poscnn_size128

paths:
  raise_csv: null
  raise_dir: ../../spectral-mask-resampling/data/raw/raise_tiff
  image_cache_dir: ../../spectral-mask-resampling/data/raw/raise_tiff
  split_json: data/splits/raise_split_seed123_local.json
  processed_dir: data/processed/n6_tv_rfft_size128
  output_dir: outputs/n6_poscnn_size128

data:
  final_size: 128
  classes:
    - original
    - JPEG_Q80
    - downsample_x8
    - downsample_x16
    - upsample_x4
    - upsample_x8
  train_images: 700
  val_images: 150
  test_images: 150
  train_samples_per_class: 5000
  val_samples_per_class: 1000
  test_samples_per_class: 1000
  jpeg_quality: 80
  interpolation: bicubic
  csv_id_column: File
  csv_url_column: TIFF
  seed: 123

preprocessing:
  residual: tv
  tv_weight: 0.08
  tv_eps: 0.0001
  tv_max_num_iter: 30
  dc_sigma_bins: 3.0
  cache_dtype: float16

spectrum:
  height: 128
  width: 128
  width_rfft: 65
  channels: 1

positional_encoding:
  use_base_coords: true
  use_axis_proximity: true
  axis_sigma: 0.03
  lambdas: [1, 2, 4, 8, 16, 32]

model:
  name: spectral_positional_cnn
  input_channels: 44
  num_classes: 6
  dropout: 0.2

training:
  device: npu
  npu_visible_devices: "0"
  batch_size: 256
  epochs: 50
  optimizer: AdamW
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  num_workers: 4
  pin_memory: true
  save_best_by: val_loss
  seed: 123
