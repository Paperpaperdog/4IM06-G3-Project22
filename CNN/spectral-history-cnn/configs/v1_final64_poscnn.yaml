experiment_name: v1_final64_poscnn4

paths:
  # Relative to this project root. The CSV contains RAISE TIFF URLs.
  raise_csv: ../../data/raise_raw/RAISE_1k.csv
  raise_dir: null
  image_cache_dir: data/raw/raise_tiff
  split_json: data/splits/raise_split_seed123.json
  processed_dir: data/processed/v1_final64_tv_rfft_4cls
  output_dir: outputs/v1_final64_poscnn4

data:
  final_size: 64
  classes:
    - original
    - JPEG
    - downsample_x8
    - downsample_x16
  train_images: 700
  val_images: 150
  test_images: 150
  train_samples_per_class: 7000
  val_samples_per_class: 1500
  test_samples_per_class: 1500
  jpeg_quality: 80
  interpolation: bicubic
  csv_id_column: File
  csv_url_column: TIFF
  seed: 123

preprocessing:
  residual: tv
  tv_weight: 0.08
  tv_eps: 0.0001
  tv_max_num_iter: 30
  dc_sigma_bins: 3.0
  cache_dtype: float16

spectrum:
  height: 64
  width: 64
  width_rfft: 33
  channels: 1

positional_encoding:
  use_base_coords: true
  use_axis_proximity: true
  axis_sigma: 0.03
  lambdas: [1, 2, 4, 8, 16, 32]

model:
  name: spectral_positional_cnn
  input_channels: 44
  num_classes: 4
  dropout: 0.2

training:
  device: cuda
  cuda_visible_devices: "0"
  batch_size: 256
  epochs: 50
  optimizer: AdamW
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  num_workers: 4
  pin_memory: true
  save_best_by: val_loss
  seed: 123
